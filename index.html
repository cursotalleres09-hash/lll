<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abriendo WhatsApp...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #00a884;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
        }
        .spinner {
            width: 54px;
            height: 54px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { color: white; font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        p { color: rgba(255,255,255,0.85); font-size: 14px; }
        .btn {
            display: none;
            margin-top: 28px;
            background: white;
            color: #00a884;
            padding: 16px 40px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h1>Abriendo WhatsApp...</h1>
    <p>Se abrirá en la pantalla de vincular dispositivo</p>
    <a href="whatsapp://fpm?version=3" class="btn" id="btn">Abrir manualmente</a>

    <script>
        // Redirige automáticamente a la app
        window.location.href = "whatsapp://fpm?version=3";
        
        // Si tras 2.5s no abrió (sigue en la página), muestra botón
        setTimeout(function() {
            if (!document.hidden) {
                document.getElementById('btn').style.display = 'inline-block';
            }
        }, 2500);
    </script>
</body>
</html>
